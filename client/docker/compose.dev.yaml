services:
  skeledok-web-server:
    image: node:22-alpine
    container_name: skeledok-web-server
    volumes:
      - ..:/app:z
      - ../.docker-node_modules:/app/node_modules:z
    ports:
      - "5173:5173"
    working_dir: /app
    entrypoint: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
