  skeledok-db-dev:
    image: postgres:19
    container_name: skeledok-db-dev
    environment:
      - POSTGRES_USER=skeledok
      - POSTGRES_PASSWORD=skeledok123!
      - POSTGRES_DB=skeledok-db-dev
      - PGDATA=/data
    volumes:
      - ./../database-dev:/data:z
    # ports:
    #   - "5432:5432"
    restart: unless-stopped

  skeledok-llm-dev:
    image: ollama/ollama:latest
    container_name: skeledok-llm-dev
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ./../models:/root/.ollama:z
    # ports:
    #   - "11434:11434"
    restart: unless-stopped
