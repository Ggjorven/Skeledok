services:
  skeledok-rest-api-dev:
    image: eclipse-temurin:21-jdk
    container_name: skeledok-rest-api-dev
    volumes:
      - ../.container-cache/.gradle-root:/root/.gradle:z
      - ../.container-cache/.gradle:/app/.gradle:z
      - ../.container-cache/.gradle-cache:/app/.gradle-cache:z
      - ../.container-cache/bin:/app/bin:z
      - ../.container-cache/build:/app/build:z
      - ../gradle:/app/gradle:z
      - ../src:/app/src:z
      - ../tests:/app/tests:z
      - ../gradlew:/app/gradlew:z
      - ../build.gradle.kts:/app/build.gradle.kts:z
      - ../settings.gradle.kts:/app/settings.gradle.kts:z
      - ../application-dev.yml:/app/application-dev.yml:z
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://skeledok-db-dev:5432/skeledok-db-dev
    ports:
      - "8080:8080"
      - "5005:5005"
    working_dir: /app
    entrypoint: ["sh", "-c", "chmod +x gradlew && ./gradlew bootRun --no-daemon"]
    depends_on:
      skeledok-db-dev:
        condition: service_healthy
    restart: unless-stopped

  skeledok-db-dev:
    image: postgres:19
    container_name: skeledok-db-dev
    environment:
      - POSTGRES_USER=skeledok
      - POSTGRES_PASSWORD=skeledok123!
      - POSTGRES_DB=skeledok-db-dev
      - PGDATA=/data
    volumes:
      - ./../database-dev:/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    restart: unless-stopped

  skeledok-llm-dev:
    image: ollama/ollama:latest
    container_name: skeledok-llm-dev
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ./../models:/root/.ollama:z
    ports:
      - "11434:11434"
    restart: unless-stopped
