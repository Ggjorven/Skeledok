services:
  skeledok-rest-api:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    container_name: skeledok-rest-api
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://skeledok-db:5432/skeledok-db
    ports:
      - "8080:8080"
    depends_on:
      skeledok-db:
        condition: service_healthy
    restart: unless-stopped

  skeledok-db:
    image: postgres:19
    container_name: skeledok-db
    environment:
      - POSTGRES_USER=skeledok
      - POSTGRES_PASSWORD=skeledok123!
      - POSTGRES_DB=skeledok-db
      - PGDATA=/data
    volumes:
      - ./../database:/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    # ports:
    #   - "5432:5432"
    restart: unless-stopped

  skeledok-llm:
    image: ollama/ollama:latest
    container_name: skeledok-llm
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ./../models:/root/.ollama:z
    # ports:
    #   - "11434:11434"
    restart: unless-stopped
