version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "Ggjorven"
    commit-message:
      prefix: ""
    pull-request-branch-name:
      separator: "/"
    target-branch: "dev"

  - package-ecosystem: "gradle"
    directory: "/server"
    schedule:
      interval: "weekly"
    assignees:
      - "Ggjorven"
    commit-message:
      prefix: ""
    pull-request-branch-name:
      separator: "/"
    target-branch: "dev"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    assignees:
      - "Ggjorven"
    commit-message:
      prefix: ""
    pull-request-branch-name:
      separator: "/"
    target-branch: "dev"
