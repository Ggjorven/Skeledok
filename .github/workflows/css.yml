name: CSS

on:
  push:
    branches: [ "main", "dev", "feature/**", "fix/**" ]
    paths:
      - .github/workflows/css.yml
      - client/styles/**
      - client/.stylelintrc.json
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - .github/workflows/css.yml
      - client/styles/**
      - client/.stylelintrc.json

jobs:
  lint-stylelint:
    name: Lint (Stylelint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Stylelint
        run: npm install --save-dev stylelint stylelint-config-standard

      - name: Run Stylelint
        run: npx stylelint "styles/**.css" --config .stylelintrc.json
        working-directory: client
